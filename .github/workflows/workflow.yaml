on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: build-test-package
    runs-on: windows-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm run test:unit

      - name: package vsix
        run: npm run package

      - name: upload vsix
        uses: actions/upload-artifact@v4
        with:
          name: strict-language-vsix
          path: '*.vsix'
